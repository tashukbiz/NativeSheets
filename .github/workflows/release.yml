name: Release the macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native-sheets
    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.0. The runner image ships
      # several Xcodes and the default one can be older than that.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: swift --version

      - run: swift test

      - run: ./Scripts/make_app.sh

      # ditto, not zip: it keeps the bundle layout and the code signature intact.
      - name: Package the bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Native Sheets.app" NativeSheets.zip
          codesign --verify --deep --strict --verbose=2 "build/Native Sheets.app"
          ls -lh NativeSheets.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NativeSheets
          path: native-sheets/NativeSheets.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: native-sheets/NativeSheets.zip
          generate_release_notes: true
